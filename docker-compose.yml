# Reverse_proxy — docker compose (server)
# Chạy từ thư mục gốc repo:
#   docker compose up -d --build
# Cần file .env trong cùng thư mục (copy từ .env.example của repo).

services:
  reverse-proxy:
    build: .
    image: vsqi-proxy-api:latest
    container_name: reverse-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Trong container luôn nghe mọi interface; việc giới hạn ra ngoài
      # do dòng ports bên dưới (chỉ 127.0.0.1) + nginx đảm nhiệm.
      HOST: 0.0.0.0
      PORT: "3100"
    ports:
      # Chỉ localhost — nginx đứng trước, không mở thẳng 3100 ra Internet.
      - "127.0.0.1:3100:3100"
    networks:
      - default
      # Mạng dùng chung với elib (tên cố định elib-net): compose này tạo mạng
      # khi `docker compose up`; elib (compose riêng) tham gia bằng external
      # network cùng tên. Khi đó đặt ELIB_BASE_URL=http://elib-service:3200
      # (elib-service là container_name của elib). Xem docs/deploy-server.md.
      - elib-net
    # Healthcheck đã có trong Dockerfile (GET /health).
    # Elib KHÔNG nằm trong compose này: chạy elib bằng compose riêng của nó
    # (PostgreSQL + elib), elib tham gia mạng elib-net ở trên nên Reverse_proxy
    # gọi thẳng http://elib-service:3200, không qua cổng host. (Cách cũ
    # host.docker.internal:3200 không dùng được vì elib chỉ bind 127.0.0.1:3200
    # trên host, còn host.docker.internal là IP bridge gateway.) Nếu chạy
    # Reverse_proxy bằng Node trực tiếp thì dùng http://127.0.0.1:3200.

networks:
  elib-net:
    name: elib-net
