# Reverse_proxy — nginx reverse proxy
# Copy vào /etc/nginx/sites-available/reverse-proxy.conf, sửa server_name,
# rồi: ln -s .../sites-available/reverse-proxy.conf /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d your-domain.example  (certbot sẽ tự thêm block 443)

server {
    listen 80;
    server_name your-domain.example;

    # App tự đặt header bảo mật (helmet) + rate limit; nginx chỉ chuyển tiếp.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tìm kiếm gộp 3 nguồn có thể chậm khi upstream chậm.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Chặn truy cập thẳng các đường dẫn nhạy cảm nếu có (app hiện không có,
    # giữ làm lớp phòng thủ khi tích hợp elib sau này).
    location = /health {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        # Muốn /health chỉ nội bộ thì bỏ comment 2 dòng dưới:
        # allow 127.0.0.1;
        # deny all;
    }
}
