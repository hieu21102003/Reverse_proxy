services:
  caddy:
    image: caddy:2-alpine
    container_name: reverse-proxy-caddy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/esign-app/esign/pki-data/server/server.crt:/etc/caddy/certs/server.crt:ro
      - /opt/esign-app/esign/pki-data/server/server.key:/etc/caddy/certs/server.key:ro
      - reverse_proxy_caddy_data:/data
      - reverse_proxy_caddy_config:/config
    depends_on:
      reverse-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  reverse_proxy_caddy_data:
  reverse_proxy_caddy_config:
